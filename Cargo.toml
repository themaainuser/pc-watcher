[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1.8"
thiserror = "2.0.21"
rusqlite = { version = "0.40.2", features = ["bundled"] }
csv = "1.4.0"
dns-lookup = "4.0.2"
etw = "0.0.1"
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_UI_Accessibility",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Power",
    "Win32_System_RemoteDesktop",
] }
tiny_http = "0.12.0"
tray-icon = "0.26.1"
tao = "0.37.1"

[profile.release]
lto = "thin"
opt-level = 3
strip = true

[profile.dev]
incremental = true
